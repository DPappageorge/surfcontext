name: Deploy

# 2026-08-31 (TASK-440): the staging/develop jobs are RETIRED — their Fly apps
# (surfcontext-develop, surfcontext-staging) no longer exist, so every
# push-deploy to those branches died at "Could not find App". Recreate the app
# AND the job together if a pre-prod environment ever returns. Production
# (main) deploys here until TASK-433 moves it to a repo-deploy pipeline.

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  deploy:
    name: Deploy (production)
    runs-on: ubuntu-latest
    needs: test
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@1.6

      - name: Deploy to production
        run: flyctl deploy --config fly.production.toml --remote-only --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
